name: Companion duplicate safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify duplicate cleanup in Electron
        shell: pwsh
        run: npm run test:companion:duplicates -- "$env:RUNNER_TEMP/companion-duplicates"
      - name: Verify floating catalogue in Electron
        shell: pwsh
        run: npm run test:companion:catalogue-widget -- "$env:RUNNER_TEMP/companion-catalogue-widget"
      - name: Verify Companion catalogue sources in Electron
        shell: pwsh
        run: |
          npm run test:companion:catalogue-sources -- "$env:RUNNER_TEMP/catalogue-source"
          if ($LASTEXITCODE -ne 0) { throw 'Catalogue source Electron verification failed' }
          $reports = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/catalogue-source" -Filter report.json -Recurse -File)
          if ($reports.Count -ne 1) { throw 'Catalogue source report missing' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.result -ne 'COMPANION_CATALOGUE_SOURCE_OK' -or $report.count -ne 6 -or @($report.passed).Count -ne 6 -or @($report.externalRequests).Count -lt 1) { throw 'Catalogue source verification incomplete' }
      - name: Verify application branding and Companion in Electron
        shell: pwsh
        run: node node_modules/electron/cli.js tests/desktop-app-electron.cjs . "$env:RUNNER_TEMP/desktop-app"
      - name: Verify Companion and OBS browser widgets in Electron
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/companion-electron.cjs "$env:RUNNER_TEMP/companion"
          if ($LASTEXITCODE -ne 0) { throw 'Companion and OBS Electron verification failed' }
          $reportPath = Join-Path $env:RUNNER_TEMP 'companion/electron-check.txt'
          if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Companion and OBS verification report missing' }
          $report = @(Get-Content -LiteralPath $reportPath -Encoding utf8)
          $checks = @($report | Select-Object -Skip 1)
          if ($report.Count -ne 72 -or $report[0] -cne 'PASS' -or $checks.Count -ne 71 -or @($checks | Sort-Object -Unique).Count -ne 71 -or @($checks | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) { throw 'Companion and OBS verification incomplete' }
      - name: Verify direct Song Request connections and widget in Electron
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/companion-song-requests-direct-electron.cjs "$env:RUNNER_TEMP/song-request-direct"
          if ($LASTEXITCODE -ne 0) { throw 'Direct Song Request Electron verification failed' }
          $reportPath = Join-Path $env:RUNNER_TEMP 'song-request-direct/song-request-direct-electron-check.json'
          if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Direct Song Request verification report missing' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.ok -ne $true -or @($report.passed).Count -ne 7) { throw 'Direct Song Request verification incomplete' }
      - name: Verify Companion workspaces, updates and backup preview in Electron
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/companion-workspaces-electron.cjs "$env:RUNNER_TEMP/companion-workspaces"
          if ($LASTEXITCODE -ne 0) { throw 'Companion workspace verification failed' }
          $reportPath = Join-Path $env:RUNNER_TEMP 'companion-workspaces/report.json'
          if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Workspace report missing' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.result -ne 'COMPANION_WORKSPACES_OK' -or @($report.passed).Count -ne 10 -or @($report.captures).Count -ne 17 -or $report.fixtureOnly -ne $true -or $report.functionalOnly -eq $true -or @($report.runtimeErrors).Count -ne 0 -or @($report.consoleErrors).Count -ne 0 -or @($report.cspErrors).Count -ne 0 -or @($report.externalRequests).Count -ne 0) { throw 'Companion workspace verification incomplete' }
          if (@(Get-ChildItem -LiteralPath (Split-Path -Parent $reportPath) -Filter '*.png' -File).Count -ne 17) { throw 'Workspace screenshots missing' }
      - name: Verify packaged updater ASAR planning without a window or installation
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node tests/updater-asar-electron.cjs "$env:RUNNER_TEMP/updater-asar"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged updater ASAR verification failed' }
          $reportPath = Join-Path $env:RUNNER_TEMP 'updater-asar/report.json'
          if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Updater ASAR report missing' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.result -ne 'UPDATER_ASAR_ELECTRON_OK' -or $report.count -ne 10 -or @($report.passed).Count -ne 10 -or @($report.passed | Sort-Object -Unique).Count -ne 10 -or $report.windows -ne 0 -or $report.externalRequests -ne 0 -or $report.fixtureOnly -ne $true -or $report.realApplicationTouched -ne $false -or $report.realProfileTouched -ne $false -or $report.helperLaunched -ne $false -or $report.authorizationCreated -ne $false -or $report.readyCreated -ne $false -or $report.runAsNodeCompatibility.electronVersion -ne '44.4.5' -or $report.runAsNodeCompatibility.originalFsAvailable -ne $true -or $report.runAsNodeCompatibility.virtualAsarRead -ne $true -or $report.runAsNodeCompatibility.requirePlannerFromAsar -ne $true -or $report.runAsNodeCompatibility.hostLoaded -ne $false -or $report.runAsNodeCompatibility.profileLoaded -ne $false -or $report.runAsNodeCompatibility.planCreated -ne $false -or $report.runAsNodeCompatibility.helperLaunched -ne $false -or $report.sourceStable -ne $true -or $report.exitCode -ne 0 -or $report.timedOut -ne $false) { throw 'Updater ASAR evidence incomplete' }
      - name: Verify ReShade optional pack review in Electron
        shell: pwsh
        run: node node_modules/electron/cli.js tests/companion-reshade-setup-electron.cjs "$env:RUNNER_TEMP/reshade-setup"
      - name: Verify bulk manual duplicate cleanup in Electron
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/companion-bulk-cleanup-electron.cjs "$env:RUNNER_TEMP/bulk-cleanup"
          if ($LASTEXITCODE -ne 0) { throw 'Bulk cleanup Electron verification failed' }
          $reports = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/bulk-cleanup" -Filter verification.json -Recurse -File)
          if ($reports.Count -ne 1) { throw 'Bulk cleanup verification report missing' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.ok -ne $true -or @($report.passed).Count -ne 3 -or @($report.recycled).Count -ne 2) { throw 'Bulk cleanup did not finish every required stage' }
      - name: Verify Clone Hero reported chart cleanup in Electron
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/companion-bad-songs-electron.cjs "$env:RUNNER_TEMP/bad-songs"
          if ($LASTEXITCODE -ne 0) { throw 'Bad songs Electron verification failed' }
          $reports = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/bad-songs" -Filter verification.json -Recurse -File)
          if ($reports.Count -ne 1) { throw 'Bad songs verification report missing' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.ok -ne $true -or @($report.passed).Count -ne 6 -or @($report.recycled).Count -ne 1 -or $report.confirmations -ne 3 -or $report.fixtureOnly -ne $true -or $report.nativeTrashUsed -ne $false -or $report.providerRequests -ne 0) { throw 'Bad songs cleanup did not finish every required stage' }
      - name: Verify local music player and spectrum models in Electron
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/companion-music-player-electron.cjs "$env:RUNNER_TEMP/music-player"
          if ($LASTEXITCODE -ne 0) { throw 'Music player Electron verification failed' }
          $reportPath = Join-Path $env:RUNNER_TEMP 'music-player/report.json'
          if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Music player verification report missing' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.ok -ne $true -or @($report.passed).Count -ne 9) { throw 'Music player verification did not finish every required stage' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-asar-verification
          path: |
            ${{ runner.temp }}/updater-asar/report.json
            ${{ runner.temp }}/updater-asar/electron-stderr.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-bad-songs-verification
          path: |
            ${{ runner.temp }}/bad-songs/**/verification.json
            ${{ runner.temp }}/bad-songs/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-duplicates-verification
          path: |
            ${{ runner.temp }}/companion-duplicates/**/verification.json
            ${{ runner.temp }}/companion-duplicates/**/failure.json
            ${{ runner.temp }}/companion-duplicates/**/failure.png
            ${{ runner.temp }}/companion-duplicates/**/selected-copy-summary.png
            ${{ runner.temp }}/companion-duplicates/**/partial-success.png
            ${{ runner.temp }}/companion-duplicates/**/notes-differences*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-bulk-cleanup-verification
          path: |
            ${{ runner.temp }}/bulk-cleanup/**/verification.json
            ${{ runner.temp }}/bulk-cleanup/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-music-player-verification
          path: |
            ${{ runner.temp }}/music-player/**/report.json
            ${{ runner.temp }}/music-player/**/failure.txt
            ${{ runner.temp }}/music-player/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reshade-setup-verification
          path: ${{ runner.temp }}/reshade-setup/verification.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-request-direct-verification
          path: |
            ${{ runner.temp }}/song-request-direct/song-request-direct-electron-check.json
            ${{ runner.temp }}/song-request-direct/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-obs-verification
          path: |
            ${{ runner.temp }}/companion/electron-check.txt
            ${{ runner.temp }}/companion/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-app-verification
          path: |
            ${{ runner.temp }}/desktop-app/verification.json
            ${{ runner.temp }}/desktop-app/failure.txt
            ${{ runner.temp }}/desktop-app/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-catalogue-widget-verification
          path: |
            ${{ runner.temp }}/companion-catalogue-widget/**/report.json
            ${{ runner.temp }}/companion-catalogue-widget/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-catalogue-source-verification
          path: |
            ${{ runner.temp }}/catalogue-source/**/report.json
            ${{ runner.temp }}/catalogue-source/**/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-workspaces-verification
          path: |
            ${{ runner.temp }}/companion-workspaces/report.json
            ${{ runner.temp }}/companion-workspaces/*.png
          if-no-files-found: error
