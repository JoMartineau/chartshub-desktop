name: Publish desktop 0.1.7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-desktop.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify archives and publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: JoMartineau/chartshub-desktop
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.1.7 --json assets,isDraft > release.json
          jq -e '[.assets[].name] | sort == (["ChartsHub-darwin-arm64.zip","ChartsHub-darwin-x64.zip","ChartsHub-linux-x64.tar.gz","ChartsHub-win32-x64.zip","SHA256SUMS.txt"] | sort)' release.json
          gh release edit v0.1.7 --draft=false --prerelease --notes "ChartsHub Desktop 0.1.7 pour Windows, macOS et Linux. Téléchargements multiples séquentiels, dossiers Artiste - Titre, dossier d’exportation mémorisé et modifiable. Téléchargez l’archive de votre système dans Assets. Version expérimentale : Windows non signé commercialement, macOS non notarisé."
