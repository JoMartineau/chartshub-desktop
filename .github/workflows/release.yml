name: Desktop release
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Check native runner architecture
        run: node -e "if(process.platform!=='${{ matrix.platform }}'||process.arch!=='${{ matrix.arch }}')throw Error('A native runner is required for this target')"
      - name: Compile TypeScript and run tests
        run: npm test
      - name: Verify public Companion, lyrics capture and filter mini restoration on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          node --test --test-name-pattern="^filter mini widget restores" tests/companion-security.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Filter mini topmost restoration verification failed' }
          node node_modules/electron/cli.js tests/public-gameplay-removal-electron.cjs "--fixture-output=$env:RUNNER_TEMP/public-companion-source"
          if ($LASTEXITCODE -ne 0) { throw 'Public Companion native verification failed' }
          node node_modules/electron/cli.js tests/companion-game-capture-lyrics-electron.cjs "--fixture-output=$env:RUNNER_TEMP/public-lyrics-source"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic lyrics capture verification failed' }
          foreach ($entry in @(@{ Directory = 'public-companion-source'; Count = 9 }, @{ Directory = 'public-lyrics-source'; Count = 8 })) {
            $reports = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP $entry.Directory) -Filter report.json -File -Recurse)
            if ($reports.Count -ne 1) { throw 'Exactly one public native report required per fixture' }
            $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
            if ($report.result -ne 'passed' -or $report.error -or @($report.checks).Count -ne $entry.Count -or @($report.checks | Sort-Object -Unique).Count -ne $entry.Count -or $report.loadedFromAsar -ne $false -or $report.realGameRead -ne $false -or @($report.externalRequests).Count -ne 0) { throw 'Public native source evidence incomplete' }
          }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: companion-public-source
          path: |
            ${{ runner.temp }}/public-companion-source/**/report.json
            ${{ runner.temp }}/public-lyrics-source/**/report.json
            ${{ runner.temp }}/public-lyrics-source/**/*.png
          if-no-files-found: warn
      - name: Verify status and update recovery UI before packaging Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/companion-workspaces-electron.cjs "$env:RUNNER_TEMP/companion-release-readiness" --functional-only
          if ($LASTEXITCODE -ne 0) { throw 'Companion release readiness verification failed' }
          $reportPath = Join-Path $env:RUNNER_TEMP 'companion-release-readiness/report.json'
          if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Companion release readiness report missing' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.result -ne 'COMPANION_WORKSPACES_FUNCTIONAL_OK' -or @($report.passed).Count -ne 12 -or @($report.passed | Sort-Object -Unique).Count -ne 12 -or $report.statusRevealOnly -ne $true -or $report.completedDownloadRecoveryUI -ne $true -or $report.fixtureOnly -ne $true -or $report.functionalOnly -ne $true -or @($report.captures).Count -ne 0 -or @($report.runtimeErrors).Count -ne 0 -or @($report.consoleErrors).Count -ne 0 -or @($report.cspErrors).Count -ne 0 -or @($report.externalRequests).Count -ne 0 -or @($report.maintenanceCalls | Where-Object { $_.action -match 'install|download|apply' }).Count -ne 0) { throw 'Companion release readiness evidence incomplete' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: companion-release-readiness
          path: ${{ runner.temp }}/companion-release-readiness/report.json
          if-no-files-found: warn
      - name: Verify shared palette, calibration start and complete widget backup on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/ui-palette-electron.cjs "$env:RUNNER_TEMP/ui-palette-sync"
          if ($LASTEXITCODE -ne 0) { throw 'Palette initial verification failed' }
          node node_modules/electron/cli.js tests/ui-palette-electron.cjs "$env:RUNNER_TEMP/ui-palette-sync" --restart --companion
          if ($LASTEXITCODE -ne 0) { throw 'Palette restart verification failed' }
          node node_modules/electron/cli.js tests/clonehero-gameplay-electron.cjs "--fixture-output=$env:RUNNER_TEMP/clonehero-gameplay-start"
          if ($LASTEXITCODE -ne 0) { throw 'Gameplay calibration start verification failed' }
          node node_modules/electron/cli.js tests/config-backup-electron.cjs "$env:RUNNER_TEMP/config-backup-widgets"
          if ($LASTEXITCODE -ne 0) { throw 'Complete widget backup verification failed' }
          node node_modules/electron/cli.js tests/calibration-hardware-electron.cjs "--fixture-output=$env:RUNNER_TEMP/calibration-hardware"
          if ($LASTEXITCODE -ne 0) { throw 'Calibration hardware guidance verification failed' }
          node node_modules/electron/cli.js tests/connector-setup-electron.cjs "--fixture-output=$env:RUNNER_TEMP/connector-setup"
          if ($LASTEXITCODE -ne 0) { throw 'Optional connector setup guidance verification failed' }
          node node_modules/electron/cli.js tests/calibration-beta-electron.cjs "--fixture-output=$env:RUNNER_TEMP/calibration-beta"
          if ($LASTEXITCODE -ne 0) { throw 'Calibration BETA workspace verification failed' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: companion-palette-calibration-backup
          path: |
            ${{ runner.temp }}/ui-palette-sync/report.json
            ${{ runner.temp }}/ui-palette-sync/restart-report.json
            ${{ runner.temp }}/clonehero-gameplay-start/**/report.json
            ${{ runner.temp }}/config-backup-widgets/report.json
            ${{ runner.temp }}/calibration-hardware/**/report.json
            ${{ runner.temp }}/connector-setup/**/report.json
            ${{ runner.temp }}/calibration-beta/**/report.json
          if-no-files-found: warn
      - name: Verify widget controls after chart results and menu
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/widget-settings-after-chart-electron.cjs "--fixture-output=$env:RUNNER_TEMP/widget-controls-after-chart"
          if ($LASTEXITCODE -ne 0) { throw 'Widget controls after chart verification failed' }
          $reports = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'widget-controls-after-chart') -Filter report.json -File -Recurse)
          if ($reports.Count -ne 1) { throw 'Exactly one widget controls report required' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.result -ne 'passed' -or @($report.checks).Count -ne 24 -or @($report.checks | Sort-Object -Unique).Count -ne 24 -or @($report.errors).Count -ne 0 -or $report.error -or $report.syntheticTelemetry -ne $true -or $report.actualHostAndIpc -ne $true -or $report.actualWindowsNamedPipe -ne $true -or $report.realGameRead -ne $false -or $report.realUserProfileRead -ne $false) { throw 'Widget controls after chart evidence incomplete' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: companion-widget-controls-after-chart
          path: |
            ${{ runner.temp }}/widget-controls-after-chart/**/report.json
            ${{ runner.temp }}/widget-controls-after-chart/**/*.png
          if-no-files-found: warn
      - name: Verify responsive widget editing during high-rate telemetry and empty chart phases
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/widget-drag-telemetry-electron.cjs "--fixture-output=$env:RUNNER_TEMP/widget-drag-live"
          if ($LASTEXITCODE -ne 0) { throw 'Live widget editing verification failed' }
          $reports = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'widget-drag-live') -Filter report.json -File -Recurse)
          if ($reports.Count -ne 1) { throw 'Exactly one live widget editing report required' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.result -ne 'passed' -or @($report.checks).Count -ne 12 -or @($report.checks | Sort-Object -Unique).Count -ne 12 -or @($report.evidence).Count -ne 5 -or @($report.errors).Count -ne 0 -or $report.error -or $report.stressSent -lt 500 -or !$report.freshMeasurements -or $report.freshMeasurements.allHitsAccepted -ne $true -or $report.freshMeasurements.acceptedSampleCount -ne $report.stressSent -or !$report.freshMeasurements.preview.accuracy -or !$report.freshMeasurements.preview.progress -or !$report.stressMetrics -or $report.stressMetrics.elapsed -le 0 -or $report.stressMetrics.maxLag -ge 500 -or $report.stressMetrics.ticks -lt ($report.stressMetrics.elapsed / 20 * 0.6) -or ($report.stressMetrics.mutations / $report.stressMetrics.elapsed * 1000) -ge 20000 -or $report.syntheticTelemetry -ne $true -or $report.actualHostAndIpc -ne $true -or $report.actualWindowsNamedPipe -ne $true -or $report.realGameRead -ne $false -or $report.realUserProfileRead -ne $false) { throw 'Live widget editing evidence incomplete' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: companion-widget-drag-live
          path: |
            ${{ runner.temp }}/widget-drag-live/**/report.json
            ${{ runner.temp }}/widget-drag-live/**/*.png
          if-no-files-found: warn
      - name: Verify customizable Input Viewer with synthetic guitar and drum inputs
        # This viewer reads only synthetic controls in its isolated fixture.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node node_modules/electron/cli.js tests/input-viewer-electron.cjs "--fixture-output=$env:RUNNER_TEMP/input-viewer"
          if ($LASTEXITCODE -ne 0) { throw 'Input Viewer native verification failed' }
          $reports = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/input-viewer" -Filter report.json -Recurse -File)
          if ($reports.Count -ne 1) { throw 'Exactly one Input Viewer report required' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.result -ne 'passed' -or @($report.checks).Count -ne 9 -or @($report.checks | Sort-Object -Unique).Count -ne 9 -or $report.realDevicesRead -ne $false -or $report.defaultRendererSecurity -ne $true -or @($report.errors).Count -ne 0 -or $report.error) { throw 'Input Viewer native evidence incomplete' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: companion-input-viewer
          path: |
            ${{ runner.temp }}/input-viewer/**/report.json
            ${{ runner.temp }}/input-viewer/**/*.png
          if-no-files-found: warn
      - name: Verify Windows updater helper survives Electron exit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node tests/updater-launcher-electron.cjs "$env:RUNNER_TEMP/updater-launcher"
          if ($LASTEXITCODE -ne 0) { throw 'Updater launcher native verification failed' }
          $reportPath = Join-Path $env:RUNNER_TEMP 'updater-launcher/report.json'
          if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Updater launcher report missing' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.result -ne 'UPDATER_LAUNCHER_ELECTRON_OK' -or $report.count -ne 11 -or @($report.passed).Count -ne 11 -or @($report.passed | Sort-Object -Unique).Count -ne 11 -or $report.defaultProductionLauncher -ne $true -or $report.loadedFromAsar -ne $true -or $report.readyHandshakeVerified -ne $true -or $report.helperExecuted -ne $true -or $report.helperSurvivedControllerExit -ne $true -or $report.inheritedProcessPolicyRestricted -ne $true -or $report.helperProcessPolicy -cne 'Bypass' -or $report.controllerExitCode -ne 0 -or $report.timedOut -ne $false -or $report.windows -ne 0 -or $report.webContents -ne 0 -or $report.externalRequests -ne 0 -or $report.fixtureOnly -ne $true -or $report.realApplicationTouched -ne $false -or $report.realProfileTouched -ne $false -or $report.installerExecuted -ne $false) { throw 'Updater launcher evidence incomplete' }
      - name: Compile Windows filters and ReShade bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zigArchive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.14.1.zip'
          $zigDirectory = Join-Path $env:RUNNER_TEMP 'chartshub-toolchain'
          # SHA-256 published at https://ziglang.org/download/index.json (0.14.1).
          $expectedHash = '554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c'
          Invoke-WebRequest -Uri 'https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip' -OutFile $zigArchive
          if ((Get-FileHash -LiteralPath $zigArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) { throw 'Zig archive SHA-256 mismatch' }
          Expand-Archive -LiteralPath $zigArchive -DestinationPath $zigDirectory
          $zigExecutable = Join-Path $zigDirectory 'zig-x86_64-windows-0.14.1/zig.exe'
          if ((& $zigExecutable version) -ne '0.14.1') { throw 'Unexpected Zig compiler version' }
          & ./native-filters/build.ps1 -Zig $zigExecutable
          & ./reshade-bridge/build.ps1 -Zig $zigExecutable
          foreach ($required in @('native-filters/bin/dxgi.dll', 'native-filters/bin/MinHook-LICENSE.txt', 'reshade-bridge/bin/ChartsHubReShade.addon64', 'reshade-bridge/bin/ReShade-SDK-LICENSE.md', 'reshade-bridge/bin/nlohmann-LICENSE.MIT')) {
            if (!(Test-Path -LiteralPath $required -PathType Leaf) -or (Get-Item -LiteralPath $required).Length -eq 0) { throw "Missing release dependency: $required" }
          }
      - run: node build.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify the actual public Windows ASAR before archiving
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          node tests/public-asar-smoke.cjs "--asar=$PWD/dist/ChartsHub-win32-x64/resources/app.asar" "--output=$env:RUNNER_TEMP/public-asar-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Actual public ASAR smoke failed' }
          $report = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'public-asar-smoke/report.json') -Raw | ConvertFrom-Json
          if ($report.result -ne 'PUBLIC_ASAR_SMOKE_OK' -or $report.error -or $report.privateMemberCount -ne 13 -or @($report.privateMembersAbsent).Count -ne 13 -or $report.entirePrivateSubtreeAbsent -ne $true -or $report.totalNativeChecks -ne 26 -or @($report.publicNativeChecks).Count -ne 3 -or $report.archiveSha256 -cne $report.archiveSha256After -or $report.publicHostDefault -ne $true -or $report.privateOptInOnBundle -ne $false -or $report.fixtureOnly -ne $true -or $report.realGameRead -ne $false -or $report.realUserProfileRead -ne $false -or $report.realHardwareRead -ne $false -or $report.realDesktopCaptured -ne $false -or $report.installationPerformed -ne $false) { throw 'Actual public ASAR evidence incomplete' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: companion-public-asar-smoke
          path: |
            ${{ runner.temp }}/public-asar-smoke/**/report.json
            ${{ runner.temp }}/public-asar-smoke/**/*.png
            ${{ runner.temp }}/public-asar-smoke/**/*.log
          if-no-files-found: warn
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ChartsHub-win32-x64 -DestinationPath ChartsHub-win32-x64.zip
      - name: Archive macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/ChartsHub-darwin-${{ matrix.arch }}/ChartsHub.app
          ditto -c -k --sequesterRsrc --keepParent dist/ChartsHub-darwin-${{ matrix.arch }} ChartsHub-darwin-${{ matrix.arch }}.zip
      - name: Archive Linux
        if: runner.os == 'Linux'
        run: tar -czf ChartsHub-linux-x64.tar.gz -C dist ChartsHub-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ChartsHub-${{ matrix.platform }}-${{ matrix.arch }}${{ github.event_name == 'pull_request' && '-candidate' || '' }}
          path: |
            ChartsHub-*.zip
            ChartsHub-*.tar.gz
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v$(node -p 'require("./package.json").version')"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          NOTES_SOURCE="docs/RELEASE-${VERSION#v}.md"
          test -s "$NOTES_SOURCE"
          cp "$NOTES_SOURCE" release-assets/RELEASE-NOTES.txt
          cd release-assets
          ASSETS=(ChartsHub-win32-x64.zip ChartsHub-linux-x64.tar.gz ChartsHub-darwin-arm64.zip ChartsHub-darwin-x64.zip)
          for ASSET in "${ASSETS[@]}"; do test -s "$ASSET"; done
          sha256sum "${ASSETS[@]}" > SHA256SUMS.txt
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --draft --title "ChartsHub $VERSION" --notes-file RELEASE-NOTES.txt
          fi
          if test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = false; then
            # Published archives remain immutable. Updating release visibility
            # must not replace downloads or move their existing tag.
            gh api "repos/$GH_REPO/releases/tags/$VERSION" > PUBLISHED-RELEASE.json
            for ASSET in "${ASSETS[@]}"; do
              jq -e --arg name "$ASSET" '.assets | any(.name == $name and .state == "uploaded" and .size > 0)' PUBLISHED-RELEASE.json >/dev/null
            done
            gh release edit "$VERSION" --prerelease=false --latest --notes-file RELEASE-NOTES.txt
            exit 0
          fi
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true
          gh release edit "$VERSION" --target "$GITHUB_SHA"
          gh release upload "$VERSION" "${ASSETS[@]}" SHA256SUMS.txt --clobber
          gh release edit "$VERSION" --draft=false --prerelease=false --latest --notes-file RELEASE-NOTES.txt
